                  - {h: 18, fixes: 7241, vehicles: 961, lines: 259, dist_m: 4025, time_s: 2190}
                  - {h: 19, fixes: 10715, vehicles: 926, lines: 257, dist_m: 250682, time_s: 73052}
                  - {h: 20, fixes: 4318, vehicles: 866, lines: 249, dist_m: 0, time_s: 0}
                  - {h: 21, fixes: 2233, vehicles: 757, lines: 242, dist_m: 0, time_s: 0}
                  - {h: 22, fixes: 1854, vehicles: 629, lines: 233, dist_m: 0, time_s: 0}
                  - {h: 23, fixes: 2037, vehicles: 490, lines: 214, dist_m: 4, time_s: 103}
