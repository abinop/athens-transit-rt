  /v1/lines/{line_id}/schedule:
    get:
      tags: [Lines]
      operationId: getLineSchedule
      summary: Timetable of a line for one day
      description: |
        The line's runs from the OASA GTFS, by direction and headsign: each run's departure from
        its first stop, GTFS style (past midnight `24:10`). For today `seen` says whether a bus of
        that run was matched. With an expired GTFS the same weekday inside the feed is used and
        `expired` is `true`. `Cache-Control: public, max-age=60`.
      parameters:
        - $ref: "#/components/parameters/LineId"
        - name: date
          in: query
          required: false
          description: Local date `YYYY-MM-DD`, today up to 7 days ahead. Default today.
          schema: {type: string, format: date}
      responses:
        "200":
          description: The timetable.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LineSchedule"
        "400":
          description: "`bad_date`: not a date, or outside today..today+7."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "404":
          description: "`unknown_line`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "503":
          description: "`warming_up`: the GTFS is not loaded yet."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/rail/stasy/departures:
    get:
      tags: [Rail]
      operationId: getStasyDepartures
      summary: Next metro and tram departures at a station (timetable)
      description: |
        From the STASY static GTFS (the open data catalogue), not live. The next `n` departures per
        line and headsign at every stop with that name (accents and case ignored).
        `indicative` is `true` when the date is outside the timetable's validity.
        `Cache-Control: public, max-age=30`.
      parameters:
        - name: stop
          in: query
          required: true
          description: Station name, e.g. `ΣΥΝΤΑΓΜΑ` or `Σύνταγμα`.
          schema: {type: string}
        - name: n
          in: query
          required: false
          description: Departures per line and headsign, 1-20. Default 6.
          schema: {type: integer, minimum: 1, maximum: 20}
      responses:
        "200":
          description: The departures, soonest first.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StasyDepartures"
        "400":
          description: "`missing_stop`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "404":
          description: "`unknown_stop`."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "503":
          description: "`warming_up`: the timetable is not loaded yet."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/rail/suburban/stations:
    get:
      tags: [Rail]
      operationId: getSuburbanStations
      summary: Suburban rail (Proastiakos) stations
      description: "From railway.gov.gr, cached 24 h. `Cache-Control: public, max-age=3600`."
      responses:
        "200":
          description: The stations with their corridors.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                type: object
                required: [stations]
                properties:
                  stations:
                    type: array
                    items: {$ref: "#/components/schemas/SuburbanStation"}
        "502":
          description: "`upstream_unavailable`: railway.gov.gr failed and nothing is cached."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/rail/suburban/stations/{id}/departures:
    get:
      tags: [Rail]
      operationId: getSuburbanDepartures
      summary: Next suburban trains of a station (live)
      description: |
        From railway.gov.gr, with the ose.mpass station screens as fallback; boards cached 10 min.
        `Cache-Control: public, max-age=60`.
      parameters:
        - name: id
          in: path
          required: true
          description: Station id from `/v1/rail/suburban/stations`.
          schema: {type: string}
        - name: n
          in: query
          required: false
          description: Trains, 1-20. Default 10.
          schema: {type: integer, minimum: 1, maximum: 20}
      responses:
        "200":
          description: The next trains.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuburbanDepartures"
        "502":
          description: "`upstream_unavailable`: both sources failed and nothing is cached."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429":
          $ref: "#/components/responses/RateLimited"

  /static/v1/lines.json:
    servers:
      - url: https://angelospk.github.io/athens-transit-rt
        description: GitHub Pages
    get:
      tags: [Static data]
      operationId: getStaticLines
      summary: All lines
      responses:
        "200":
          description: Every line of the current GTFS (example trimmed to 2 lines).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaticLines"
              example:
                gtfs_version: "2026-07-08"
                lines:
                  - {id: "021", name: "ΠΛΑΤΕΙΑ ΚΑΝΙΓΓΟΣ - ΓΚΥΖH (ΚΥΚΛΙΚΗ)", name_en: "", color: "#153ce0", text_color: "#ffffff", kind: bus}
                  - {id: "022", name: "ΑΚΑΔΗΜΙΑ - Ν. ΚΥΨΕΛΗ (ΚΥΚΛΙΚΗ)", name_en: "", color: "#153ce0", text_color: "#ffffff", kind: bus}

  /static/v1/lines/{line_id}.json:
    servers:
      - url: https://angelospk.github.io/athens-transit-rt
        description: GitHub Pages
    get:
      tags: [Static data]
      operationId: getStaticLine
      summary: Variants, shapes and stops of one line
      description: |
        `variant` of a live vehicle keys into `variants`. Greek ids only (no Latin look-alikes
        here), percent-encoded: `Α1` is `%CE%911.json`.
      parameters:
        - name: line_id
          in: path
          required: true
          description: OASA line number, Greek uppercase, as in `lines.json`.
          schema:
            type: string
          example: "040"
      responses:
        "200":
          description: The line (example trimmed to one variant with 2 shape points and 2 stops).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaticLine"
              example:
                id: "040"
                variants:
                  "5512":
                    headsign: ΠΕΙΡΑΙΑΣ - ΣΥΝΤΑΓΜΑ(ΠΡΟΣΩΡΙΝΗ ΛΟΓΩ ΕΡΓΩΝ)
                    direction: 0
                    shape: [[37.93848, 23.63165], [37.93845, 23.63225]]
                    stops: ["10183", "400191"]
                stops:
                  "10183": {name: ΠΕΙΡΑΙΑΣ, lat: 37.93843, lon: 23.63188}
                  "400191": {name: ΚΛΕΙΣΟΒΗΣ, lat: 37.93532, lon: 23.63393}
        "404":
          description: No such line (GitHub Pages HTML error page).

components:
  parameters:
    LineId:
      name: line_id
      in: path
      required: true
      description: |
        OASA line number in Greek uppercase (`040`, `550`, `Α1`, `Χ96`), percent-encoded.
        Latin look-alikes also work (`A1` → `Α1`).
      schema:
        type: string
      example: "040"

  headers:
    CacheControl:
      description: "`public, max-age=<seconds>`; see the operation for the value."
      schema:
        type: string
    ETag:
      description: Version of the snapshot body. Send it back in `If-None-Match` for `304`.
      schema:
        type: string

  responses:
    RateLimited:
      description: |
        From Cloudflare: more than about 30 requests per 10 s from one IP. Wait at least 10 s.

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum: [unknown_line, not_found, warming_up, feed_unavailable, query_not_allowed, bad_date, internal, missing_stop, unknown_stop, upstream_unavailable]

    LatLon:
      type: array
      description: "`[lat, lon]`, 5 decimals."
      prefixItems:
        - type: number
          minimum: -90
          maximum: 90
        - type: number
          minimum: -180
          maximum: 180
      minItems: 2
      maxItems: 2

    Motion:
      description: Fields shared by every vehicle entry with paths.
      type: object
      properties:
        speed:
          type: [number, "null"]
          minimum: 0
          maximum: 20
          description: |
            Smoothed speed along the route in m/s, one decimal. `0` = standing. `null` when
            unknown (first sighting, long gap, ambiguous position, more than 150 m from the shape).
        path:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/LatLon"
          description: |
            The route ahead, from the vehicle's point on its shape (at `position_at`) to its next
            stop when matched, otherwise `max(speed × 150 s, 300 m)` ahead; at most 1.5 km.
            `null` when there is nothing to move along.
        path_beyond:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/LatLon"
          description: |
            Matched vehicles only: the route on from the end of `path` to the third stop ahead
            (at most 1.5 km from the vehicle). Its first point is the last point of `path`.
        path_stops:
          type: [array, "null"]
          items:
            type: integer
            minimum: 0
          description: |
            The stops on `path` followed by `path_beyond`, as whole metres along those points,
            ascending. `null` when not matched or no stop is on them.
        path_speeds:
          type: [array, "null"]
          maxItems: 8
          items:
            type: [number, "null"]
            minimum: 0.1
          description: |
            Typical speed ahead in m/s for consecutive 200 m steps (step `i` covers metres
            `200·i` to `200·(i+1)`), from the last 14 days of fixes on the same shape, day type
            and local hour. A step with no history is `null`. `null` when unmatched or unknown.

    VehicleBase:
      type: object
      required: [id, lat, lon, bearing, position_at, variant, delay_s]
      properties:
        id:
          type: string
          description: OASA vehicle number.
        lat:
          type: number
          minimum: -90
          maximum: 90
        lon:
          type: number
          minimum: -180
          maximum: 180
        bearing:
          type: [number, "null"]
          minimum: 0
          maximum: 360
          description: Degrees clockwise from north. `null` when unknown.
        position_at:
          type: integer
          description: Time of the GPS fix (Unix seconds).
        variant:
          type: [string, "null"]
          description: |
            Shape id; keys into `variants` of `/static/v1/lines/{line_id}.json`. `null` when no
            static variant matches.
        delay_s:
          type: [integer, "null"]
          description: Delay against the schedule in seconds (negative = early). `null` when not matched to a trip.

    LineVehicle:
      allOf:
        - $ref: "#/components/schemas/VehicleBase"
        - $ref: "#/components/schemas/Motion"
        - type: object
          required: [route_code, trip_id, trip_label, next_stop_id, speed, path, path_beyond, path_stops, path_speeds]
          properties:
            route_code:
              type: string
              description: OASA route code of the vehicle's current route.
            trip_id:
              type: [string, "null"]
              description: GTFS `trip_id` of the matched trip, `null` when not matched.
            trip_label:
              type: [string, "null"]
              description: Departure time and direction, e.g. `00:15 ΣΥΝΤΑΓΜΑ → ΠΕΙΡΑΙΑΣ`.
            next_stop_id:
              type: [string, "null"]
              description: GTFS `stop_id` of the next stop.

    CityVehicle:
      description: A vehicle of `/v1/vehicles` or a `z` 13 tile.
      allOf:
        - $ref: "#/components/schemas/VehicleBase"
        - $ref: "#/components/schemas/Motion"
        - type: object
          required: [line, speed, path, path_beyond, path_stops, path_speeds]
          properties:
            line:
              type: string
              description: Line id.

    CityVehicleLite:
      description: A vehicle of a `z` 9 tile. The keys `path`, `path_beyond`, `path_stops`, `path_speeds` are absent.
      allOf:
        - $ref: "#/components/schemas/VehicleBase"
        - type: object
          required: [line, speed]
          properties:
            line:
              type: string
              description: Line id.
            speed:
              $ref: "#/components/schemas/Motion/properties/speed"

    LineResponse:
      type: object
      required: [line, updated_at, next_update_at, vehicles]
      properties:
        line:
          type: string
          description: Canonical (Greek) line id.
        updated_at:
          type: integer
          description: Time of the poll that gave this data.
        next_update_at:
          type: integer
          description: Earliest time new data can exist. Refetch then, not earlier.
        vehicles:
          type: array
          items:
            $ref: "#/components/schemas/LineVehicle"

    VehiclesResponse:
      type: object
      required: [updated_at, next_update_at, vehicles]
      properties:
        updated_at:
          type: integer
          description: Build time of the snapshot.
        next_update_at:
          type: integer
          description: Earliest next build.
        vehicles:
          type: array
          items:
            $ref: "#/components/schemas/CityVehicle"

    TileResponse:
      type: object
      required: [updated_at, next_update_at, vehicles]
      properties:
        updated_at:
          type: integer
          description: Build time of the snapshot (the same as `/v1/vehicles`).
        next_update_at:
          type: integer
          description: Earliest next build.
        vehicles:
          type: array
          description: "`CityVehicle` entries in `z` 13 tiles, `CityVehicleLite` entries in `z` 9 tiles."
          items:
            anyOf:
              - $ref: "#/components/schemas/CityVehicle"
              - $ref: "#/components/schemas/CityVehicleLite"

    Status:
      type: object
      required: [ok, gtfs_version, gtfs_expires, updated_at, lines_active, budget_rps]
      properties:
        ok:
          type: boolean
          description: "`false` when no line poll succeeded in the last 5 minutes."
        gtfs_version:
          type: string
          description: Version (start date) of the static GTFS in use.
        gtfs_expires:
          type: string
          description: Last service date of that GTFS.
        updated_at:
          type: integer
          description: Time of the last published poll (0 before the first one).
        lines_active:
          type: integer
          description: Lines with scheduled service now.
        budget_rps:
          type: number
          description: OASA requests per second the poller may use.

    GtfsRtFeed:
      type: object
      description: |
        A GTFS-Realtime `FeedMessage` in protobuf JSON. Only the fields this server sets are
        listed; see the [GTFS-RT reference](https://gtfs.org/documentation/realtime/reference/).
      required: [header]
      properties:
        header:
          type: object
          required: [gtfsRealtimeVersion, incrementality, timestamp]
          properties:
            gtfsRealtimeVersion:
              type: string
            incrementality:
              const: FULL_DATASET
            timestamp:
              type: string
              pattern: "^[0-9]+$"
        entity:
          type: array
          description: Absent when the feed has no entity (protobuf JSON omits empty lists).
          items:
            type: object
            required: [id]
            properties:
              id:
                type: string
              vehicle:
                type: object
                properties:
                  trip:
                    $ref: "#/components/schemas/GtfsRtTrip"
                  vehicle:
                    type: object
                    properties:
                      id: {type: string}
                      label: {type: string}
                  position:
                    type: object
                    required: [latitude, longitude]
                    properties:
                      latitude: {type: number}
                      longitude: {type: number}
                      bearing: {type: number}
                  currentStopSequence: {type: integer}
                  stopId: {type: string}
                  currentStatus: {type: string, enum: [IN_TRANSIT_TO, STOPPED_AT]}
                  timestamp: {type: string, pattern: "^[0-9]+$"}
              tripUpdate:
                type: object
                required: [trip, stopTimeUpdate]
                properties:
                  trip:
                    $ref: "#/components/schemas/GtfsRtTrip"
                  vehicle:
                    type: object
                    properties:
                      id: {type: string}
                  stopTimeUpdate:
                    type: array
                    items:
                      type: object
                      properties:
                        stopSequence: {type: integer}
                        stopId: {type: string}
                        arrival:
                          description: Set while the vehicle is on its way to the stop.
                          type: object
                          properties:
                            delay: {type: integer}
                        departure:
                          description: Set instead of `arrival` while the vehicle waits at its first stop.
                          type: object
                          properties:
                            delay: {type: integer}
                        scheduleRelationship: {type: string}
                  timestamp: {type: string, pattern: "^[0-9]+$"}

    GtfsRtTrip:
      type: object
      required: [routeId]
      properties:
        tripId: {type: string}
        routeId: {type: string}
        startDate: {type: string, pattern: "^[0-9]{8}$"}
        scheduleRelationship: {type: string}

    StatsIndex:
      type: object
      required: [version, latest, days]
      properties:
        version:
          type: integer
          const: 1
        latest:
          type: string
          format: date
        days:
          type: array
          items:
            type: string
            format: date

    StatsDay:
      type: object
      required: [version, date, tz, generated_at, first_fix, last_fix, files, fixes, vehicles, lines, hours, by_line]
      properties:
        version:
          type: integer
          const: 1
        date:
          type: string
          format: date
        tz:
          type: string
          example: Europe/Athens
        generated_at:
          type: integer
          description: When the file was written.
        first_fix:
          type: integer
          description: First fix time of the day (0 when the day has no fix).
        last_fix:
          type: integer
          description: Last fix time of the day.
        files:
          type: integer
          description: History archives read.
        fixes:
          type: integer
          description: GPS fixes.
        vehicles:
          type: integer
          description: Distinct vehicles that sent a fix (depends on polling).
        lines:
          type: integer
          description: Distinct lines.
        hours:
          type: array
          description: 24 entries, index = local hour.
          minItems: 24
          maxItems: 24
          items:
            type: object
            required: [h, fixes, vehicles, lines, dist_m, time_s]
            properties:
              h: {type: integer, minimum: 0, maximum: 23}
              fixes: {type: integer}
              vehicles: {type: integer}
              lines: {type: integer}
              dist_m: {type: integer, description: Metres driven in the speed samples.}
              time_s: {type: integer, description: Seconds of the speed samples.}
        by_line:
          type: array
          description: Every line with a fix, by id.
          items:
            type: object
            required: [line, fixes, vehicles, dist_m, time_s]
            properties:
              line: {type: string}
              fixes: {type: integer}
              vehicles: {type: integer}
              dist_m: {type: integer}
              time_s: {type: integer}
        trips:
          type: object
          description: |
            Scheduled trips that start in the day (static GTFS) and how many ran. A trip ran when
            the vehicles matched to it covered at least `min_coverage` of its shape between 30 min
            before its start and 30 min after its end. Missing when the server had no static GTFS
            of the day's history. `run + partial + missed + unmeasured = planned`.
          required: [gtfs, gtfs_expired, min_coverage, planned, run, partial, missed, unmeasured, by_line]
          properties:
            gtfs: {type: string, description: Static GTFS version the trips come from.}
            gtfs_expired:
              type: boolean
              description: The day is outside the feed's validity; its trips are those of the same weekday inside it.
            min_coverage: {type: number, example: 0.5}
            planned: {type: integer}
            run: {type: integer, description: Covered at least min_coverage.}
            partial: {type: integer, description: "Seen, but covered less."}
            missed: {type: integer, description: Never seen.}
            unmeasured: {type: integer, description: No usable shape.}
            by_line:
              type: array
              description: Every line with a planned trip, by id.
              items:
                type: object
                required: [line, planned, run, partial, missed, unmeasured, missed_trips]
                properties:
                  line: {type: string}
                  planned: {type: integer}
                  run: {type: integer}
                  partial: {type: integer}
                  missed: {type: integer}
                  unmeasured: {type: integer}
                  missed_trips:
                    type: [array, "null"]
                    description: GTFS trip_ids never seen, by start time.
                    items: {type: string}

    StaticLines:
      type: object
      required: [gtfs_version, lines]
      properties:
        gtfs_version:
          type: string
        lines:
          type: array
          items:
            type: object
            required: [id, name, name_en, color, text_color, kind]
            properties:
              id: {type: string}
              name: {type: string, description: Greek name.}
              name_en: {type: string, description: "English name, may be empty."}
              color: {type: string, pattern: "^#[0-9a-fA-F]{6}$"}
              text_color: {type: string, pattern: "^#[0-9a-fA-F]{6}$"}
              kind: {type: string, enum: [bus, trolley]}

    StaticLine:
      type: object
      required: [id, variants, stops]
      properties:
        id:
          type: string
        variants:
          type: object
          description: By shape id (the live `variant`).
          additionalProperties:
            type: object
            required: [headsign, direction, shape, stops]
            properties:
              headsign: {type: string}
              direction: {type: integer, enum: [0, 1]}
              shape:
                type: array
                items:
                  $ref: "#/components/schemas/LatLon"
              stops:
                type: array
                description: Stop ids in order.
                items: {type: string}
        stops:
          type: object
          description: By GTFS `stop_id`.
          additionalProperties:
            type: object
            required: [name, lat, lon]
            properties:
              name: {type: string}
              lat: {type: number}
              lon: {type: number}

    LineSchedule:
      type: object
      required: [line, date, expired, directions]
      properties:
        line: {type: string}
        date: {type: string, format: date}
        expired:
          type: boolean
          description: The GTFS has expired; the times are the same weekday of the old timetable.
        directions:
          type: array
          items:
            type: object
            required: [direction, headsign, departures]
            properties:
              direction: {type: integer, enum: [0, 1]}
              headsign: {type: string}
              departures:
                type: array
                items:
                  type: object
                  required: [t, trip]
                  properties:
                    t: {type: string, description: "Departure from the first stop, `HH:MM`, may pass 24:00."}
                    trip: {type: string}
                    seen: {type: boolean, description: "Today only: a bus of this run was matched."}

    StasyDepartures:
      type: object
      required: [stop, indicative, departures]
      properties:
        stop: {type: string}
        indicative: {type: boolean}
        departures:
          type: array
          items:
            type: object
            required: [line, route_color, headsign, t, in_s]
            properties:
              line: {type: string, example: M2}
              route_color: {type: string, example: "#e30613"}
              headsign: {type: string}
              t: {type: string, description: "`HH:MM`, may pass 24:00."}
              in_s: {type: integer, description: Seconds from now.}

    SuburbanStation:
      type: object
      required: [id, name, corridors]
      properties:
        id: {type: string}
        name: {type: string}
        corridors:
          type: array
          items: {type: string}

    SuburbanDepartures:
      type: object
      required: [station, departures]
      properties:
        station: {type: string}
        departures:
          type: array
          items:
            type: object
            required: [train, from, to, t, delay_min, platform, status]
            properties:
              train: {type: string}
              from: {type: string}
              to: {type: string}
              t: {type: string, description: "Scheduled time, `HH:MM` Athens local."}
              delay_min: {type: [integer, "null"]}
              platform: {type: [string, "null"]}
              status: {type: string}
