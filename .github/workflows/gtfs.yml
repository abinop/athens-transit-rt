# Checks data.gov.gr for a new OASA GTFS every 6 h. On change it builds the snapshot
# (release asset, downloaded by the server) and the static map data (GitHub Pages).
# GitHub Pages also serves the API docs (docs/openapi/). A Pages deployment replaces the
# whole site, so every deployment comes from here: a push that changes the docs rebuilds the
# static data from the same GTFS (release assets untouched) and deploys it with the docs.
name: gtfs
on:
  push:
    branches: [main]
    paths:
      - docs/openapi/**
      - .github/workflows/gtfs.yml
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: rebuild even if the GTFS did not change
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: gtfs
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.snap.outputs.changed }}
      pages: ${{ steps.snap.outputs.changed == 'true' || github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o atrt ./cmd/atrt
      - id: snap
        run: ./atrt snapshot --if-changed=${{ inputs.force != true }} --work work --out dist --site site
      - name: Publish release assets
        if: steps.snap.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view gtfs-snapshot >/dev/null 2>&1 || \
            gh release create gtfs-snapshot --title "GTFS snapshot" --notes "Rolling snapshot of the OASA static GTFS, rebuilt by the gtfs workflow." --latest=false
          # Snapshot first, manifest last: the server only trusts a manifest whose checksum matches.
          gh release upload gtfs-snapshot dist/snapshot.bin --clobber
          gh release upload gtfs-snapshot dist/manifest.json --clobber
          cat dist/manifest.json
      - name: Rebuild static data for a docs-only deployment
        if: steps.snap.outputs.changed != 'true' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download gtfs-snapshot -p manifest.json -D release
          ./atrt snapshot --work work --out dist --site site
          # The GTFS was unchanged a moment ago; fail if OASA published a new one in between
          # (the next scheduled run publishes it), so the static data matches the release.
          jq -e --slurpfile r release/manifest.json \
            '.etag == $r[0].etag and .last_modified == $r[0].last_modified and .gtfs_size == $r[0].gtfs_size' dist/manifest.json
          # Publish the release's manifest, not the rebuilt one (other built_at and checksum).
          cp release/manifest.json dist/manifest.json
      - name: Prepare Pages
        if: steps.snap.outputs.changed == 'true' || github.event_name == 'push'
        run: |
          cp dist/manifest.json site/static/v1/manifest.json
          cp docs/openapi/index.html docs/openapi/openapi.yaml site/
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
        if: steps.snap.outputs.changed == 'true' || github.event_name == 'push'
      - uses: actions/upload-pages-artifact@v3
        if: steps.snap.outputs.changed == 'true' || github.event_name == 'push'
        with:
          path: site
  deploy:
    needs: build
    if: needs.build.outputs.pages == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
